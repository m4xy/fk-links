name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Nightly, so a change to fckt, kiln or a library it uses is tested here without a push here.
  schedule:
    - cron: "17 4 * * *"

# Built with fckt and kiln as they are on main, checked out beside it, as bootstrap.sh expects.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: fk-links
      - uses: actions/checkout@v5
        with:
          repository: m4xy/fckt
          path: fckt
      - uses: actions/checkout@v5
        with:
          repository: m4xy/kastor
          path: kastor
      - uses: actions/checkout@v5
        with:
          repository: m4xy/kiln
          path: kiln
      - uses: actions/checkout@v5
        with:
          repository: m4xy/fk-tests
          path: fk-tests
      - uses: actions/checkout@v5
        with:
          repository: m4xy/fk-cli
          path: fk-cli
      - uses: actions/checkout@v5
        with:
          repository: m4xy/fk-regex
          path: fk-regex
      - uses: actions/checkout@v5
        with:
          repository: m4xy/fk-sqlite
          path: fk-sqlite
      - uses: actions/checkout@v5
        with:
          repository: m4xy/fk-serialization
          path: fk-serialization
      - uses: actions/checkout@v5
        with:
          repository: m4xy/fk-http
          path: fk-http
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5
      - run: opam install -y ssl sqlite3 ocamlfind
      - name: Build fckt
        working-directory: fckt
        run: ./gradlew :installDist && echo "$PWD/build/install/fckt/bin" >> "$GITHUB_PATH"
      - name: Bootstrap kiln
        working-directory: kiln
        run: opam exec -- ./bootstrap.sh && echo "$HOME/.kiln/bin" >> "$GITHUB_PATH"
      - name: Publish fk-cli
        working-directory: fk-cli
        run: opam exec -- kiln publishLocal
      - name: Publish fk-regex
        working-directory: fk-regex
        run: opam exec -- kiln publishLocal
      - name: Publish fk-sqlite
        working-directory: fk-sqlite
        run: opam exec -- kiln publishLocal
      - name: Publish fckt.symbols
        working-directory: fckt/symbols
        run: opam exec -- kiln publishLocal
      - name: Publish fk-serialization
        working-directory: fk-serialization
        run: opam exec -- kiln publishLocal
      - name: Publish fk-http
        working-directory: fk-http
        run: opam exec -- kiln publishLocal
      - name: Build and test
        working-directory: fk-links
        run: opam exec -- kiln build
